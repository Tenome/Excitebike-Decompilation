name: tool tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python tests/test_tools.py
      - run: python tests/test_serve.py
      - run: python tests/test_longdesign.py
      - run: python tests/test_interp.py
      - run: python tests/test_editors.py
